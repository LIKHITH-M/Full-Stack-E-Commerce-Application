global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # "backend" is resolved by Docker DNS to the backend container.
      # Changed from host.docker.internal:8081 (local dev) to backend:8081 (compose).
      # If running Prometheus standalone (not in compose), revert to host.docker.internal:8081
      - targets: ['backend:8081']
        labels:
          application: 'ecom-proj-backend'
