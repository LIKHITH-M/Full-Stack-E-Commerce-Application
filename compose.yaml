# =============================================================
# compose.yaml - Full-Stack E-Commerce Application
# All 7 services: mysql, redis, kafka, backend, frontend, prometheus, grafana
#
# Usage:
#   docker compose up --build -d   (start everything)
#   docker compose down             (stop, preserve volumes)
#   docker compose down -v          (stop + delete all data - DESTRUCTIVE)
# =============================================================

services:

  # ===========================================================
  # Service 1: MySQL 8.0 (primary database)
  # NOT exposed to host - only backend container can reach it
  # on port 3306 via Docker's internal network.
  # ===========================================================
  mysql:
    image: mysql:8.0
    container_name: ecom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ecom_proj
    volumes:
      # Named volume: data survives "docker compose down" (but not "docker compose down -v")
      - mysql_data:/var/lib/mysql
    # healthcheck lets other services wait until MySQL is actually ready,
    # not just started. Without this, backend may crash on connection refused.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecom-network

  # ===========================================================
  # Service 2: Redis 7.2 (cache layer)
  # NOT exposed to host - backend reaches it on port 6379 internally.
  # Alpine variant = ~35 MB image instead of ~120 MB
  # ===========================================================
  redis:
    image: redis:7.2-alpine
    container_name: ecom-redis
    restart: unless-stopped
    volumes:
      # Redis is a cache - losing data on restart is tolerable.
      # But a volume avoids cold-start cache misses after restarts.
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-network

  # ===========================================================
  # Service 3: Kafka (KRaft mode - no ZooKeeper required)
  #
  # Two listeners explained:
  #   INTERNAL://kafka:9092    <- used by backend container
  #     (inside compose, "localhost" = the container itself, not kafka)
  #   EXTERNAL://localhost:29092 <- used by YOU on Windows to inspect topics
  #     (curl / kafka CLI tools from your host machine use this)
  # ===========================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ecom-kafka
    restart: unless-stopped
    ports:
      # Only 29092 is exposed to your Windows host for external inspection.
      # Port 9092 (INTERNAL) is reachable only inside the Docker network.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: container-to-container on port 9092
      # EXTERNAL: host machine on port 29092
      # CONTROLLER: Kafka internal controller communication
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - ecom-network

  # ===========================================================
  # Service 4: Spring Boot Backend
  # Built from ./backend/Dockerfile (multi-stage Maven build).
  # Waits for mysql, redis, and kafka to be HEALTHY (not just started).
  # ===========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Override application.properties defaults for containerized environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecom_proj?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect

      # Redis: use service name "redis" (Docker DNS resolves it)
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Kafka: INTERNAL listener - backend is inside Docker, uses port 9092
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # CORS: frontend container serves on port 80
      FRONTEND_URL: http://localhost

      # JWT - override default in production, using env var from .env
      JWT_SECRET: ${JWT_SECRET}

      # Razorpay
      RAZORPAY_API_KEY: ${RAZORPAY_API_KEY}
      RAZORPAY_API_SECRET: ${RAZORPAY_API_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

      # Email / SMTP
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}

    ports:
      # Exposed to host so you can curl http://localhost:8081/actuator/health
      # and so Prometheus on the host (or in compose) can scrape metrics.
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - ecom-network

  # ===========================================================
  # Service 5: React Frontend (Nginx)
  # Built from ./frontend/Dockerfile (Node build -> Nginx serve).
  # Nginx proxies /api/* -> backend:8081 (no localhost in React code needed).
  # ===========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecom-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Main browser entry point - open http://localhost
      - "80:80"
    networks:
      - ecom-network

  # ===========================================================
  # Service 6: Prometheus (metrics collection)
  # Scrapes backend:8081/actuator/prometheus every 5s.
  # "backend" resolves via Docker DNS to the backend container.
  # ===========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ecom-prometheus
    restart: unless-stopped
    volumes:
      # Bind mount: reads prometheus.yml from the project root
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ecom-network

  # ===========================================================
  # Service 7: Grafana (metrics visualization)
  # Default login: admin / see .env GF_SECURITY_ADMIN_PASSWORD
  # ===========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ecom-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ecom-network

# ===========================================================
# Named Volumes
# Data persists across "docker compose down" restarts.
# Use "docker compose down -v" to delete all data (DESTRUCTIVE).
# ===========================================================
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  grafana_data:

# ===========================================================
# Networks
# All services share one bridge network (ecom-network).
# Docker provides DNS: each container's service name resolves
# to its IP address automatically (mysql, redis, kafka, backend, etc.)
# ===========================================================
networks:
  ecom-network:
    driver: bridge
