# frontend/nginx.conf
# This file configures Nginx to:
#   1. Serve the React SPA (built by Vite into dist/)
#   2. Handle React Router - all unknown routes return index.html
#   3. Proxy /api/* and /actuator/* to the backend container

server {
    listen 80;
    server_name localhost;

    # Root directory where Vite build output is placed (see frontend/Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets (JS, CSS, images) with aggressive caching.
    # The "immutable" directive tells browsers these hashed filenames never change.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # IMPORTANT: React Router fallback
    # Without this, refreshing any non-root URL (e.g. /products/5) returns 404
    # because Nginx tries to find a file at that path (which doesn't exist).
    # try_files checks for the file first, then falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the backend Spring Boot service.
    # "backend" is resolved by Docker's internal DNS to the backend container IP.
    # This is why the React app doesn't need to know the backend's real IP or port.
    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Proxy /actuator/* to backend (for health checks from outside the cluster)
    location /actuator/ {
        proxy_pass http://backend:8081/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Razorpay payment gateway callback (if used)
    location /payment/ {
        proxy_pass http://backend:8081/payment/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
