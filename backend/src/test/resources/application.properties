# H2 In-Memory Database for All Test Runs (No MySQL required)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.kafka.listener.auto-startup=false

# JWT Test Secret (Base64 encoded 256-bit secret)
jwt.secret=dGVzdF9qd3Rfc2VjcmV0X2tleV9mb3JfdGVzdGluZ19tdXN0X2JlX2F0X2xlYXN0XzI1Nl9iaXRz

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=testpassword

# Razorpay Configuration
razorpay.api.key=rzp_test_mock_key
razorpay.api.secret=rzp_test_mock_secret
razorpay.webhook.secret=rzp_test_mock_webhook_secret


# =============================================
# Redis Cache Configuration
# =============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# Default cache TTL in milliseconds (10 minutes)
spring.cache.redis.time-to-live=600000
spring.cache.type=redis