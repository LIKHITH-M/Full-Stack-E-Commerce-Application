spring.application.name=ecom-proj
server.port=${SERVER_PORT:8081}

# =============================================
# Spring Boot Actuator & Prometheus Observability
# =============================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.hikari=true
management.metrics.enable.jvm=true

# JWT Authentication Secret
jwt.secret=${JWT_SECRET:ecom_proj_default_jwt_secret_key_must_be_at_least_256_bits_long_for_hmac_sha256_security}

# Set to false to allow app startup even if Kafka is not running
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}

# =============================================
# Datasource Configuration (MySQL local default / PostgreSQL cloud)
# =============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecom_proj?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:}

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION:false}

# =============================================
# Razorpay Payment Gateway
# =============================================
razorpay.api.key=${RAZORPAY_API_KEY:your_razorpay_key}
razorpay.api.secret=${RAZORPAY_API_SECRET:your_razorpay_secret}

# =============================================
# Kafka Configuration (Supports Local KRaft & Cloud SASL/SSL)
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=ecom-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# =============================================
# Email / SMTP Configuration
# =============================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:likithgowdam10@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

