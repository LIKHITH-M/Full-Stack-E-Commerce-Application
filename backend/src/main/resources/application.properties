spring.application.name=ecom-proj
server.port=${SERVER_PORT:8081}

# =============================================
# Spring Boot Actuator & Prometheus Observability
# =============================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.hikari=true
management.metrics.enable.jvm=true

# JWT Authentication Secret (Secure 512-bit cryptographically random Base64 key for local dev; overridable via JWT_SECRET env var)
jwt.secret=${JWT_SECRET:Ia1l5t8iuRm3zCfGL9sAp+1AlPi+R17yQjwyULdwZ1HHcl6ts+H6YkLcF2ttz8J5qYuPoAqH+HN0Vcvl/16pQw==}

# Disable mail health indicator check so /actuator/health reports UP even without live SMTP credentials
management.health.mail.enabled=false

# Configurable Frontend URL for CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}

# Set to false to allow app startup even if Kafka is not running
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}

# =============================================
# Datasource Configuration (MySQL local default / PostgreSQL cloud)
# =============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecom_proj?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:}

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION:false}

# =============================================
# Razorpay Payment Gateway
# =============================================
razorpay.api.key=${RAZORPAY_API_KEY:rzp_test_ToUXkFkXqdjYh8}
razorpay.api.secret=${RAZORPAY_API_SECRET:j632VGsvOd3WjjJ1FJjLRvEN}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# =============================================
# Kafka Configuration (Supports Local KRaft & Cloud SASL/SSL)
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=ecom-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Cloud SASL/SSL Kafka properties (set via env vars in cloud production, omitted for local PLAINTEXT)
# spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:}
# spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
